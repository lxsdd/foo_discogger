name: Discogger modernization validation

# Open work branches are always checked through draft PRs; their push events
# would otherwise run the same expensive Win32/x64 link CI a second time.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discogger-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Source contract regression checks
        run: python3 tests/source_contracts.py
      - name: Compile and run portable query-history CRC32 regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/crc32_test.cpp -o /tmp/discogger-crc32-test && /tmp/discogger-crc32-test
      - name: Compile and run mapping lifetime regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/mapping_snapshot_test.cpp -o /tmp/discogger-mappings-test && /tmp/discogger-mappings-test
      - name: Compile HTTP status parser in C++17
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/http_status_parser_test.cpp -o /tmp/discogger-http-test
      - name: Run HTTP status regression tests
        run: /tmp/discogger-http-test
      - name: Compile and run abort-responsive network wait regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 -pthread tests/interruptible_wait_test.cpp -o /tmp/discogger-wait-test && /tmp/discogger-wait-test
      - name: Compile collaboration search fallback helper
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/collaboration_fallback_test.cpp -o /tmp/discogger-search-test
      - name: Run collaboration search fallback tests
        run: /tmp/discogger-search-test
      - name: Compile and run exact-filter fallback visibility tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/search_visibility_test.cpp -o /tmp/discogger-search-visibility && /tmp/discogger-search-visibility
      - name: Compile and run artist double-click selection regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/artist_activation_test.cpp -o /tmp/discogger-artist-activate && /tmp/discogger-artist-activate
      - name: Compile and run bounded cached thumbnail regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/thumbnail_bounds_test.cpp -o /tmp/discogger-thumbnail-test && /tmp/discogger-thumbnail-test
      - name: Compile and run stale release-tree snapshot regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/release_tree_snapshot_test.cpp -o /tmp/discogger-release-tree && /tmp/discogger-release-tree
      - name: Compile and run strict direct release ID validation
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/release_id_test.cpp -o /tmp/discogger-release-id && /tmp/discogger-release-id
      - name: Compile and run multi-value field token regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/multivalue_fields_test.cpp -o /tmp/discogger-multivalue-test && /tmp/discogger-multivalue-test
      - name: Compile and run LRU cache exception regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 -pthread tests/cache_lru_test.cpp -o /tmp/discogger-cache-test && /tmp/discogger-cache-test
      - name: Compile and run online artist-refresh concurrency and retry tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 -pthread tests/artist_refresh_test.cpp -o /tmp/discogger-artist-refresh && /tmp/discogger-artist-refresh
      - name: Compile and run multi-artist in-flight ownership regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/artist_load_ownership_test.cpp -o /tmp/discogger-artist-owned && /tmp/discogger-artist-owned
      - name: Compile and run disk-cache TTL boundary regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/cache_expiry_test.cpp -o /tmp/discogger-cache-expiry && /tmp/discogger-cache-expiry
      - name: Compile and run disk-cache page integrity regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/cache_pages_test.cpp -o /tmp/discogger-cache-pages && /tmp/discogger-cache-pages
      - name: Compile and run directory cache rollback and recovery regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 -pthread tests/directory_cache_transaction_test.cpp -o /tmp/discogger-cache-directory && /tmp/discogger-cache-directory
      - name: Compile and run configuration snapshot migrations
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/cfg_snapshot_ops_test.cpp -o /tmp/discogger-cfg-test && /tmp/discogger-cfg-test
      - name: Verify private SQLite namespace mapping across all linker imports
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/sqlite_symbol_namespace_test.cpp -o /tmp/discogger-sqlite-namespace-test && /tmp/discogger-sqlite-namespace-test
      - name: Compile and run async write ownership tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 -pthread tests/async_write_lease_test.cpp -o /tmp/discogger-write-lease && /tmp/discogger-write-lease
      - name: Compile and run artwork no-op plus bounded-read regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 -pthread tests/artwork_noop_test.cpp -o /tmp/discogger-artwork-noop && /tmp/discogger-artwork-noop
      - name: Test physical tag deletion previews and CUESHEET preservation
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/tag_deletion_preflight_test.cpp -o /tmp/discogger-tag-deletions && /tmp/discogger-tag-deletions
      - name: Compile physical/subsong write-safety preflight tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/write_safety_test.cpp -o /tmp/discogger-write-safety-test
      - name: Run physical/subsong write-safety regression tests
        run: /tmp/discogger-write-safety-test

  windows-baseline:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Check source contracts on Windows
        shell: pwsh
        run: python tests/source_contracts.py
      - name: Parse strict PowerShell DLL build script before costly native compilation
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($scriptFile in @('scripts/build-component-dll.ps1', 'scripts/normalize-native-bitmaps.ps1', 'tests/native-bitmap-resource-test.ps1', 'scripts/host-discogger-gui.ps1')) {
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) $scriptFile), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Test legacy resource image formats and fail-closed conversion
        shell: pwsh
        run: ./tests/native-bitmap-resource-test.ps1
      - name: Record Visual Studio availability
        shell: pwsh
        run: |
          msbuild -version -nologo
          Write-Host 'NOTE: This checks MSBuild availability, NOT a full component build.'
          Write-Host 'A full build needs staged foobar SDK, WTL, libPPUI, Jansson, OAuth, SQLite and zlib dependencies.'

  windows-native-unit:
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute portable C++17 unit tests using MSVC
        shell: pwsh
        run: ./scripts/run-msvc-unit-tests.ps1 -Architecture '${{ matrix.architecture }}'

  official-sdk-probe:
    # Fail cheap/static and native unit gates before launching the costly SDK
    # download and two complete Win32/x64 component link operations.
    needs: [portable-core, windows-baseline, windows-native-unit]
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Verify pinned official SDK 2026-10-01 on Windows
        shell: pwsh
        run: ./scripts/probe-official-sdk.ps1
      - name: Compile official SDK core libraries for Win32 and x64 (not Discogger DLL)
        shell: pwsh
        run: ./scripts/build-official-sdk-libs.ps1
      - name: Stage pinned first-party and third-party dependencies for hard DLL build
        shell: pwsh
        run: ./scripts/diagnose-component-compile.ps1 -StageOnly
      - name: HARD GATE - full Win32 x64 Discogger DLL build and link
        shell: pwsh
        run: ./scripts/build-component-dll.ps1
      - name: HARD GATE - real foobar2000 Win32 component host load
        uses: lxsdd/dev-infrastructure-public/.github/actions/foobar-host-smoke@99cc4b8c31d4ac8e640da0c375675566dc44762e
        with:
          architecture: Win32
          component-dll: ${{ runner.temp }}/discogger-sdk-probe/foobar2000/foo_discogger/Win32/Release/foo_discogger.dll
      - name: HARD GATE - real foobar2000 x64 component host load
        uses: lxsdd/dev-infrastructure-public/.github/actions/foobar-host-smoke@99cc4b8c31d4ac8e640da0c375675566dc44762e
        with:
          architecture: x64
          component-dll: ${{ runner.temp }}/discogger-sdk-probe/foobar2000/foo_discogger/x64/Release/foo_discogger.dll
      - name: HARD GATE - Discogger first-run SQLite configuration and Win32 native GUI
        shell: pwsh
        run: ./scripts/host-discogger-gui.ps1 -Architecture Win32 -ComponentDll "$env:RUNNER_TEMP/discogger-sdk-probe/foobar2000/foo_discogger/Win32/Release/foo_discogger.dll"
      - name: HARD GATE - Discogger first-run SQLite configuration and x64 native GUI
        shell: pwsh
        run: ./scripts/host-discogger-gui.ps1 -Architecture x64 -ComponentDll "$env:RUNNER_TEMP/discogger-sdk-probe/foobar2000/foo_discogger/x64/Release/foo_discogger.dll"

