name: Discogger modernization validation

on:
  push:
    branches:
      - 'work/**'
      - 'fix/tags-conf-declaration-20261018'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discogger-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Source contract regression checks
        run: python3 tests/source_contracts.py
      - name: Compile and run portable query-history CRC32 regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/crc32_test.cpp -o /tmp/discogger-crc32-test && /tmp/discogger-crc32-test
      - name: Compile and run mapping lifetime regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/mapping_snapshot_test.cpp -o /tmp/discogger-mappings-test && /tmp/discogger-mappings-test
      - name: Compile HTTP status parser in C++17
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/http_status_parser_test.cpp -o /tmp/discogger-http-test
      - name: Run HTTP status regression tests
        run: /tmp/discogger-http-test
      - name: Compile and run abort-responsive network wait regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 -pthread tests/interruptible_wait_test.cpp -o /tmp/discogger-wait-test && /tmp/discogger-wait-test
      - name: Compile collaboration search fallback helper
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/collaboration_fallback_test.cpp -o /tmp/discogger-search-test
      - name: Run collaboration search fallback tests
        run: /tmp/discogger-search-test
      - name: Compile and run multi-value field token regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/multivalue_fields_test.cpp -o /tmp/discogger-multivalue-test && /tmp/discogger-multivalue-test
      - name: Compile and run LRU cache exception regressions
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 -pthread tests/cache_lru_test.cpp -o /tmp/discogger-cache-test && /tmp/discogger-cache-test
      - name: Compile and run configuration snapshot migrations
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/cfg_snapshot_ops_test.cpp -o /tmp/discogger-cfg-test && /tmp/discogger-cfg-test
      - name: Compile physical/subsong write-safety preflight tests
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/write_safety_test.cpp -o /tmp/discogger-write-safety-test
      - name: Run physical/subsong write-safety regression tests
        run: /tmp/discogger-write-safety-test

  windows-baseline:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Check source contracts on Windows
        shell: pwsh
        run: python tests/source_contracts.py
      - name: Parse strict PowerShell DLL build script before costly native compilation
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($scriptFile in @('scripts/build-component-dll.ps1', 'scripts/normalize-native-bitmaps.ps1', 'tests/native-bitmap-resource-test.ps1')) {
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) $scriptFile), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Test legacy resource image formats and fail-closed conversion
        shell: pwsh
        run: ./tests/native-bitmap-resource-test.ps1
      - name: Record Visual Studio availability
        shell: pwsh
        run: |
          msbuild -version -nologo
          Write-Host 'NOTE: This checks MSBuild availability, NOT a full component build.'
          Write-Host 'A full build needs staged foobar SDK, WTL, libPPUI, Jansson, OAuth, SQLite and zlib dependencies.'

  windows-native-unit:
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute portable C++17 unit tests using MSVC
        shell: pwsh
        run: ./scripts/run-msvc-unit-tests.ps1 -Architecture '${{ matrix.architecture }}'

  official-sdk-probe:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Verify pinned official SDK 2026-10-01 on Windows
        shell: pwsh
        run: ./scripts/probe-official-sdk.ps1
      - name: Compile official SDK core libraries for Win32 and x64 (not Discogger DLL)
        shell: pwsh
        run: ./scripts/build-official-sdk-libs.ps1
      - name: Diagnose first-party Discogger compilation (no DLL link or deploy)
        shell: pwsh
        run: ./scripts/diagnose-component-compile.ps1
      - name: HARD GATE - full Win32 x64 Discogger DLL build and link
        shell: pwsh
        run: ./scripts/build-component-dll.ps1
